<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printing Locked - PrintFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fef3c7;
            color: #92400e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            text-align: center;
            padding: 48px 32px;
            max-width: 420px;
            width: 100%;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: #f59e0b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            color: white;
        }
        h1 { font-size: 24px; margin-bottom: 12px; color: #92400e; }
        .info { color: #4b5563; font-size: 16px; margin-bottom: 24px; line-height: 1.5; }
        .code-form {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .code-input {
            padding: 12px 16px;
            border: 2px solid #d97706;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            width: 160px;
            letter-spacing: 4px;
            outline: none;
        }
        .code-input:focus {
            border-color: #2563eb;
        }
        .btn-unlock {
            padding: 12px 24px;
            background: #059669;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .or-divider {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 16px;
        }
        a {
            display: inline-block;
            padding: 12px 32px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        .error-msg {
            color: #dc2626;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#128274;</div>
        <h1>Printing is locked</h1>
        <p class="info">
            Hi {{ user.full_name }}, printing is currently locked.
            Enter the print code to proceed.
        </p>
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ unlock_url }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="code-form">
                <input type="text" name="lock_password" class="code-input" placeholder="Code" autofocus autocomplete="off">
                <button type="submit" class="btn-unlock">Print</button>
            </div>
        </form>
        <div class="or-divider">or</div>
        <a href="{{ url_for('user.dashboard') }}">Go to Dashboard</a>
    </div>
</body>
</html>
