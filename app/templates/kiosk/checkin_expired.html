<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Expired - PrintFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fef2f2;
            color: #991b1b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            text-align: center;
            padding: 48px 32px;
            max-width: 400px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .info { color: #4b5563; font-size: 16px; margin-bottom: 24px; }
        a {
            display: inline-block;
            padding: 12px 32px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#8635;</div>
        <h1>QR code expired</h1>
        <p class="info">This code has already been used or has changed. Please scan the new QR code on the screen.</p>
        <a href="{{ url_for('user.dashboard') }}">Go to Dashboard</a>
    </div>
</body>
</html>
