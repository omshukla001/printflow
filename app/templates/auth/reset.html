{% extends "base.html" %}
{% block title %}Reset Password - PrintFlow{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">PrintFlow</h1>
        <p class="auth-subtitle">Choose a new password</p>

        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="identifier">Username or email</label>
                <input type="text" id="identifier" name="identifier" required
                       value="{{ identifier or '' }}"
                       placeholder="Your username or email" autocomplete="username"
                       {{ 'autofocus' if not identifier }}>
            </div>
            <div class="form-group">
                <label for="code">Reset code</label>
                <input type="text" id="code" name="code" required
                       placeholder="8 characters" autocomplete="one-time-code"
                       maxlength="8" class="code-input"
                       {{ 'autofocus' if identifier }}>
            </div>
            <div class="form-group">
                <label for="password">New password</label>
                <input type="password" id="password" name="password" required
                       placeholder="At least 8 characters, with letters + digits"
                       autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       placeholder="Repeat new password" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Set new password</button>
        </form>

        <p class="auth-footer">
            No code yet? <a href="{{ url_for('auth.forgot_password') }}">Request one</a>
        </p>
        <p class="auth-footer" style="margin-top:8px;">
            <a href="{{ url_for('auth.login') }}">Back to sign in</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>
{% endblock %}
